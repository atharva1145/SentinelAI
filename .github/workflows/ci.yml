name: SentinelAI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run linting (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ tests/ --output-format=github

      - name: Run type checks (pyright)
        working-directory: backend
        run: |
          pip install pyright
          pyright app/ --pythonversion 3.12 || true

      - name: Run tests with SQLite
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          UPLOAD_DIR: /tmp/sentinel_uploads
          MAX_UPLOAD_SIZE_MB: "10"
          ALLOWED_ORIGINS: "http://localhost:5173"
          ENVIRONMENT: test
        run: |
          mkdir -p /tmp/sentinel_uploads
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend-tests:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
